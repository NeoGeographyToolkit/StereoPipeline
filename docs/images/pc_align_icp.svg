<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="pc_align translates the DEM so it passes through the reference altimetry points">
  <defs>
    <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- figure surface -->
  <rect x="0.5" y="0.5" width="759" height="299" rx="10" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.1"/>

  <!-- panel titles -->
  <text x="210" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">before pc_align</text>
  <text x="550" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">after</text>

  <!-- before: DEM profile offset from reference points -->
  <path d="M 90 220 L 150 185 L 195 200 L 250 155 L 300 180 L 330 172" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/>
  <g fill="#0b0b0b">
    <circle cx="102" cy="213" r="3"/>
    <circle cx="138" cy="192" r="3"/>
    <circle cx="172" cy="192" r="3"/>
    <circle cx="216" cy="183" r="3"/>
    <circle cx="250" cy="155" r="3"/>
    <circle cx="286" cy="173" r="3"/>
    <circle cx="318" cy="175" r="3"/>
  </g>
  <path d="M 108 192 L 168 157 L 213 172 L 268 127 L 318 152 L 348 144" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <line x1="288" y1="130" x2="272" y2="152" stroke="#52514e" stroke-width="1.3" marker-end="url(#garrow)"/>
  <text x="298" y="126" font-size="11.5" fill="#52514e">translation</text>

  <!-- after: DEM profile on the reference points -->
  <g fill="#0b0b0b">
    <circle cx="442" cy="213" r="3"/>
    <circle cx="478" cy="192" r="3"/>
    <circle cx="512" cy="192" r="3"/>
    <circle cx="556" cy="183" r="3"/>
    <circle cx="590" cy="155" r="3"/>
    <circle cx="626" cy="173" r="3"/>
    <circle cx="658" cy="175" r="3"/>
  </g>
  <path d="M 430 220 L 490 185 L 535 200 L 590 155 L 640 180 L 670 172" fill="none" stroke="#2a78d6" stroke-width="2"/>

  <!-- legend -->
  <line x1="270" y1="266" x2="298" y2="266" stroke="#2a78d6" stroke-width="2"/>
  <text x="306" y="270" font-size="11.5" fill="#52514e">produced DEM</text>
  <circle cx="408" cy="266" r="3" fill="#0b0b0b"/>
  <text x="418" y="270" font-size="11.5" fill="#52514e">reference points (ICESat-2)</text>
</svg>
