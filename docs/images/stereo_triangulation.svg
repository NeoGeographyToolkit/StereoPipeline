<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Rays from matched pixels in two images intersect at the triangulated ground point">
  <!-- figure surface -->
  <rect x="0.5" y="0.5" width="759" height="347" rx="10" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.1"/>

  <!-- rays -->
  <line x1="180" y1="68" x2="380" y2="300" stroke="#2a78d6" stroke-width="1.8"/>
  <line x1="580" y1="68" x2="380" y2="300" stroke="#2a78d6" stroke-width="1.8"/>

  <!-- satellite 1 -->
  <g transform="translate(180,52)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>
  <!-- satellite 2 -->
  <g transform="translate(580,52)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>

  <!-- image strips -->
  <rect x="120" y="96" width="150" height="24" rx="5" fill="#fcfcfb" stroke="#898781"/>
  <text x="122" y="91" font-size="11" fill="#898781">left image</text>
  <line x1="214" y1="99" x2="214" y2="117" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="214" y="136" text-anchor="middle" font-size="11" fill="#52514e">matched pixel</text>

  <rect x="490" y="96" width="150" height="24" rx="5" fill="#fcfcfb" stroke="#898781"/>
  <text x="638" y="91" text-anchor="end" font-size="11" fill="#898781">right image</text>
  <line x1="546" y1="99" x2="546" y2="117" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="546" y="136" text-anchor="middle" font-size="11" fill="#52514e">matched pixel</text>

  <!-- ground -->
  <line x1="60" y1="300" x2="700" y2="300" stroke="#c3c2b7" stroke-width="1.5"/>
  <circle cx="380" cy="300" r="4" fill="#0b0b0b"/>
  <text x="380" y="324" text-anchor="middle" font-size="12" fill="#52514e">triangulated ground point</text>
</svg>
