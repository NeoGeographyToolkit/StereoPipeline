<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Before bundle adjustment the two camera rays miss each other; after, they intersect cleanly">
  <!-- figure surface -->
  <rect x="0.5" y="0.5" width="759" height="299" rx="10" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.1"/>

  <!-- panel titles -->
  <text x="210" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">before bundle adjustment</text>
  <text x="550" y="44" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">after</text>

  <!-- before: rays miss -->
  <g transform="translate(112,66) scale(0.7)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>
  <g transform="translate(308,66) scale(0.7)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>
  <line x1="112" y1="76" x2="200" y2="225" stroke="#2a78d6" stroke-width="1.8"/>
  <line x1="308" y1="76" x2="226" y2="232" stroke="#2a78d6" stroke-width="1.8"/>
  <circle cx="213" cy="228" r="24" fill="none" stroke="#e34948" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="213" y="277" text-anchor="middle" font-size="12" fill="#e34948">rays miss: triangulation error</text>

  <!-- after: rays meet -->
  <g transform="translate(452,66) scale(0.7)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>
  <g transform="translate(648,66) scale(0.7)">
    <rect x="-26" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="10" y="-6" width="16" height="12" fill="#2a78d6"/>
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#52514e"/>
  </g>
  <line x1="452" y1="76" x2="550" y2="230" stroke="#2a78d6" stroke-width="1.8"/>
  <line x1="648" y1="76" x2="550" y2="230" stroke="#2a78d6" stroke-width="1.8"/>
  <circle cx="550" cy="230" r="4" fill="#0b0b0b"/>
  <text x="550" y="277" text-anchor="middle" font-size="12" fill="#52514e">rays intersect</text>
</svg>
